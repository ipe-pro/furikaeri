<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふりかえり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F3EF; --grid:rgba(34,48,90,.06); --surface:#FFFFFF; --surface-2:#F4FAF8;
  --ink:#22305A; --ink-soft:#5A6789; --line:#C6DAD4; --line-strong:#9FBDB5;
  --go:#2E7DD7; --go-shadow:#1C58A3; --go-ink:#FFFFFF;
  --sel:#FFF4C9; --bubble:#FFFFFF; --warn:#D0473C; --focus:#F2A900;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172039; --grid:rgba(238,242,255,.05); --surface:#212B4B; --surface-2:#1C2542;
    --ink:#EEF2FF; --ink-soft:#AEB8D6; --line:#34406A; --line-strong:#4E5C8C;
    --go:#3B8BE6; --go-shadow:#1D4F8F; --go-ink:#FFFFFF;
    --sel:#3A3A22; --bubble:#2A3558; --warn:#FF7A6E; --focus:#FFC83D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172039; --grid:rgba(238,242,255,.05); --surface:#212B4B; --surface-2:#1C2542;
  --ink:#EEF2FF; --ink-soft:#AEB8D6; --line:#34406A; --line-strong:#4E5C8C;
  --go:#3B8BE6; --go-shadow:#1D4F8F; --go-ink:#FFFFFF;
  --sel:#3A3A22; --bubble:#2A3558; --warn:#FF7A6E; --focus:#FFC83D;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink); background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size:36px 36px;
  line-height:1.6; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
img,svg{max-width:100%}
.back,.listen{white-space:nowrap;flex:none}
.opt span,.bubble,.q,.goal,.big-msg,.sub-msg,.hint{word-break:keep-all;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- common ---------- */
.go{
  border:0;border-radius:999px;background:var(--go);color:var(--go-ink);
  font-size:1.7rem;font-weight:900;padding:.55em 1.6em;letter-spacing:.08em;
  box-shadow:0 7px 0 var(--go-shadow);transition:transform .08s, box-shadow .08s;
}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--go-shadow)}
.go[disabled]{opacity:.35;cursor:default}
.plain{border:3px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:.35em 1em;font-weight:700;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.3em;border-radius:14px;font-weight:700;z-index:50;max-width:90vw}

/* ---------- home ---------- */
.home{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.home-card{max-width:640px;width:100%}
.home h1{font-size:clamp(3rem,9vw,5.2rem);font-weight:900;margin:.1em 0 .2em;letter-spacing:.12em;line-height:1.1}
.home .char-wrap{width:min(260px,60vw);margin:0 auto}
.today-goal{background:var(--surface);border:3px solid var(--line);border-radius:26px;padding:.8em 1.2em;margin:1.2em auto 1.6em;font-size:1.25rem;max-width:520px}
.today-goal .subj{display:inline-block;background:var(--ink);color:var(--bg);border-radius:999px;padding:.05em .8em;font-weight:900;margin-right:.5em}
.teacher-link{position:fixed;right:14px;bottom:12px;font-size:.9rem;background:transparent;border:2px dashed var(--line-strong);border-radius:10px;padding:.3em .8em;color:var(--ink-soft)}

/* ---------- kid flow ---------- */
.kid{min-height:100vh;display:flex;flex-direction:column}
.kid-top{display:flex;align-items:center;gap:12px;padding:12px 18px}
.steps{display:flex;gap:8px;list-style:none;margin:0 auto;padding:0}
.steps li{width:18px;height:18px;border-radius:50%;background:var(--line);border:3px solid var(--line)}
.steps li.done{background:var(--line-strong);border-color:var(--line-strong)}
.steps li.now{background:#FFD66B;border-color:var(--ink);transform:scale(1.25)}
.listen{display:flex;align-items:center;gap:.35em;border:3px solid var(--ink);background:var(--surface);border-radius:999px;padding:.3em 1em .3em .7em;font-weight:900;font-size:1.25rem}
.listen svg{width:28px;height:28px}
.back{border:0;background:transparent;font-weight:700;font-size:1.1rem;color:var(--ink-soft);padding:.4em .6em}
.back[hidden]{visibility:hidden;display:inline-block}
.kid-main{flex:1;display:grid;grid-template-columns:minmax(210px,290px) 1fr;gap:24px;padding:8px 28px 28px;align-items:start;max-width:1200px;width:100%;margin:0 auto}
.guide{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.guide .char-wrap{width:100%;max-width:230px}
.bubble{position:relative;background:var(--bubble);border:3px solid var(--ink);border-radius:24px;padding:.7em 1em;font-size:1.3rem;font-weight:700;line-height:1.55;width:100%;order:-1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-14px;width:22px;height:22px;background:var(--bubble);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
.q{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:900;margin:0;line-height:1.35;letter-spacing:.04em}
.hint{font-size:1.2rem;color:var(--ink-soft);margin:-8px 0 0;font-weight:700}
.opts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opt{
  background:var(--surface);border:4px solid var(--line);border-radius:24px;
  box-shadow:0 6px 0 var(--line);padding:14px 12px;min-height:130px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-size:1.35rem;font-weight:900;line-height:1.35;text-align:center;transition:transform .08s, box-shadow .08s;
}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.on{border-color:var(--ink);box-shadow:0 6px 0 var(--ink);background:var(--sel)}
.opt.dim{opacity:.4}
.opt .ico{font-size:2.6rem;line-height:1}
.opt svg{width:84px;height:84px}
.opt.feel.on{background:color-mix(in srgb, var(--c) 28%, var(--surface))}
.opts.feel{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opts.ach .opt svg{width:96px;height:96px}
.opt .stars{color:#F2A900;font-size:1.1rem;letter-spacing:.1em;min-height:1.3em}
.nums{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.num{background:var(--surface);border:4px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);font-size:2rem;font-weight:900;height:84px}
.num:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.go-row{display:flex;justify-content:center;padding-top:6px;min-height:84px;align-items:center}
.goal-card{background:var(--surface);border:4px solid var(--ink);border-radius:30px;padding:1.2em 1.4em;text-align:center}
.goal-card .subj{display:inline-block;background:var(--ink);color:var(--bg);border-radius:999px;padding:.1em 1em;font-weight:900;font-size:1.5rem}
.goal-card .label{font-size:1.2rem;font-weight:700;color:var(--ink-soft);margin:.8em 0 0}
.goal-card .goal{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;line-height:1.4;margin:.1em 0 0;letter-spacing:.04em}

/* reward */
.reward{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.stampcard{background:var(--surface);border:4px solid var(--ink);border-radius:28px;padding:18px;display:grid;grid-template-columns:repeat(5,64px);gap:12px;justify-content:center}
.stamp{width:64px;height:64px;border-radius:50%;border:3px dashed var(--line-strong);display:grid;place-items:center}
.stamp.got{border:0}
.stamp svg{width:64px;height:64px}
.stamp.new svg{animation:press .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes press{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.big-msg{font-size:clamp(1.8rem,3.6vw,2.4rem);font-weight:900;margin:0}
.sub-msg{font-size:1.35rem;font-weight:700;margin:0}

/* footprints */
.foot-wrap{background:var(--surface);border:4px solid var(--line);border-radius:28px;padding:10px 12px;overflow-x:auto}
.foot-wrap svg{display:block;min-width:560px;width:100%;height:auto}
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.cmp{background:var(--surface);border:4px solid var(--line);border-radius:24px;padding:12px;text-align:center}
.cmp.now{border-color:var(--ink)}
.cmp h3{margin:0;font-size:1.3rem}
.cmp svg{width:78px;height:78px}
.cmp .stars{color:#F2A900;font-size:1.4rem;letter-spacing:.12em}
.arrow{font-size:2.4rem;font-weight:900;color:var(--ink-soft)}

/* ---------- pin ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,34,.55);display:grid;place-items:center;z-index:40;padding:16px}
.pin{background:var(--surface);border-radius:26px;padding:22px;width:min(340px,100%);text-align:center}
.pin h2{margin:0 0 6px;font-size:1.3rem}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:10px 0 16px}
.pin-dots span{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink)}
.pin-dots span.f{background:var(--ink)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-pad button{height:58px;border-radius:16px;border:3px solid var(--line);background:var(--surface-2);font-size:1.5rem;font-weight:700}
.pin .err{color:var(--warn);font-weight:700;min-height:1.6em;margin:0}
.pin small{display:block;color:var(--ink-soft);margin-top:10px}

/* ---------- teacher ---------- */
.t{min-height:100vh;background:var(--surface-2);font-size:15px}
.t-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;background:var(--surface);border-bottom:2px solid var(--line)}
.t-top h1{font-size:1.2rem;margin:0}
.t-top .note{color:var(--ink-soft);font-size:.85rem}
.t-top .right{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px 0;border-bottom:2px solid var(--line);background:var(--surface)}
.tab{border:0;background:transparent;padding:.55em 1em;border-radius:12px 12px 0 0;font-weight:700;color:var(--ink-soft);position:relative;top:2px;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);background:var(--surface-2)}
.tab .badge{display:inline-block;min-width:1.4em;padding:0 .35em;border-radius:999px;background:var(--warn);color:#fff;font-size:.8rem;margin-left:.3em}
.t-body{padding:20px;max-width:1280px}
.t-body h2{font-size:1.15rem;margin:0 0 .3em}
.t-body p.lead{margin:0 0 1em;color:var(--ink-soft);max-width:70ch}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:18px}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:collapse;font-size:.9rem;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
table.grid thead th{position:sticky;top:0;background:var(--surface);font-weight:700;font-size:.82rem}
table.grid thead th small{display:block;color:var(--ink-soft);font-weight:500}
table.grid tbody th{position:sticky;left:0;background:var(--surface);z-index:1}
table.grid tbody tr:hover td, table.grid tbody tr:hover th{background:var(--surface-2)}
.no-btn{border:0;background:transparent;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 6px}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--c);color:#1E1E2A;font-weight:900;font-size:.85rem;margin:1px}
.chip.neg{box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.flag{color:var(--warn);font-weight:900}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--ink-soft);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--c);vertical-align:-2px;margin-right:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:12em 1fr 3em;gap:8px;align-items:center;font-size:.9rem}
.bar .track{height:18px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--c,var(--ink-soft))}
.bar .n{text-align:right;font-weight:700}
.kpis{display:flex;flex-wrap:wrap;gap:12px 28px;margin-bottom:10px}
.kpi b{font-size:1.6rem;display:block;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--ink-soft)}
.watch-item{display:grid;grid-template-columns:5em 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.watch-item:last-child{border-bottom:0}
.watch-item .who{font-weight:900;font-size:1.1rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:560px}
.field label{font-weight:700;font-size:.9rem}
.field small{color:var(--ink-soft)}
.field input,.field select,.field textarea{font:inherit;font-size:1rem;padding:.5em .7em;border:2px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink)}
.field textarea{min-height:4.5em;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:.5em 1.1em;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{border-color:var(--warn);background:transparent;color:var(--warn)}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:520px;width:100%;height:auto}
.muted{color:var(--ink-soft)}
.preview{border:2px dashed var(--line-strong);border-radius:16px;padding:12px;margin-top:8px;text-align:center}
.preview .subj{display:inline-block;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 .8em;font-weight:900}
.preview .goal{font-size:1.4rem;font-weight:900;margin:.2em 0 0}

@media (max-width: 820px){
  .kid-main{grid-template-columns:1fr;padding:6px 14px 24px;gap:12px}
  .guide{position:static;flex-direction:row;align-items:center}
  .guide .char-wrap{width:110px;flex:none}
  .bubble{order:1;font-size:1.1rem}
  .bubble::after{left:-14px;top:50%;bottom:auto;transform:translateY(-50%) rotate(135deg)}
  .opts{grid-template-columns:repeat(2,1fr)}
  .opts.feel{grid-template-columns:repeat(3,1fr)}
  .opt{min-height:110px;font-size:1.15rem}
  .stampcard{grid-template-columns:repeat(5,48px)}
  .stamp,.stamp svg{width:48px;height:48px}
  .steps li{width:13px;height:13px}
  .listen{font-size:1.05rem}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- v2: 学級目標・ミッション・ごはん ---------- */
.goalband{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;margin:0 auto 10px}
.goalband .main{font-weight:900;font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:.08em}
.goalband .tags{display:flex;gap:8px}
.goalband .tags span{background:#FFE58A;color:#3A2E1F;border:3px solid #3A2E1F;border-radius:999px;padding:0 .7em;font-weight:900;font-size:1.05rem}
.mission-card{background:var(--surface);border:4px solid var(--ink);border-radius:30px;padding:1em 1.2em;text-align:center}
.mission-card .mlabel{display:inline-block;background:#3E8E2F;color:#fff;border-radius:999px;padding:.05em 1em;font-weight:900;font-size:1.15rem}
.mission-card .mtext{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:900;line-height:1.4;margin:.25em 0 0;letter-spacing:.04em;word-break:keep-all;overflow-wrap:anywhere}
.promise{background:var(--surface);border:3px dashed var(--line-strong);border-radius:22px;padding:.7em 1em;font-size:1.2rem;font-weight:700}
.promise b{font-weight:900}
.pea-box{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:4px solid var(--line);border-radius:28px;padding:12px 16px}
.pea-box .pea{width:180px}
.pea-box h3{margin:0 0 6px;font-size:1.2rem}
.gauge{display:grid;grid-template-columns:repeat(10,minmax(0,44px));gap:6px}
.gauge svg{width:100%;height:auto;display:block}
.gauge .new svg{animation:pop .8s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:translateY(-30px) scale(1.8);opacity:0}100%{transform:none;opacity:1}}
.okawari{font-weight:900;margin-top:6px}
.mine{font-weight:900;font-size:1.15rem;margin:0}
.feed-btn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:1.5rem;color:var(--ink)}
.feed-btn svg{width:120px;height:120px;filter:drop-shadow(0 6px 0 var(--line-strong))}
.feed-btn:active svg{transform:translateY(4px);filter:drop-shadow(0 2px 0 var(--line-strong))}
.pea.munch svg{animation:munch .9s ease both}
@keyframes munch{0%{transform:scale(1)}25%{transform:scale(1.12,.9)}50%{transform:scale(.95,1.08)}75%{transform:scale(1.05,.96)}100%{transform:scale(1)}}
.letter{position:relative;background:#FFFBEA;color:#3A2E1F;border:4px solid #3A2E1F;border-radius:22px;padding:1em 1.2em;text-align:left;max-width:560px;margin:0 auto;box-shadow:0 6px 0 #C9B26A}
.letter .from{font-weight:900;margin:0;color:#B8453A}
.letter .msg{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:900;line-height:1.6;margin:.2em 0 0;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.letter.opening{animation:unfold .9s cubic-bezier(.2,1.2,.4,1) both;transform-origin:top center}
@keyframes unfold{0%{transform:scaleY(.1);opacity:0}100%{transform:none;opacity:1}}
.sealed{display:flex;align-items:center;gap:12px;justify-content:center;font-weight:700;font-size:1.05rem;color:var(--ink-soft)}
.sealed svg{width:64px;height:auto;flex:none}
.home-card{max-width:760px}
.home .pea-box{text-align:left;margin:12px 0}
.pea-img{display:flex;flex-direction:column;align-items:center}
.pea-img img{width:calc(100% * var(--k));height:auto}
.pea-img .badges{font-size:1.3rem;min-height:1.4em}
.chip.pt{position:relative}
.chip.pt::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #2A2A3A}
.why-row.odd td{background:color-mix(in srgb, var(--warn) 10%, transparent)}
.pill{display:inline-block;border-radius:999px;padding:0 .6em;font-size:.8rem;font-weight:700;border:1.5px solid currentColor}
.pill.warn{color:var(--warn)}
@media (max-width: 820px){
  .pea-box{grid-template-columns:1fr;justify-items:center;text-align:center}
  .gauge{grid-template-columns:repeat(10,minmax(0,28px))}
}
/* v3: 先生の絵のグリンピースさん */
.pea-svg{display:block;width:100%;height:auto;overflow:visible}
.opt svg.pea-svg{width:140px;height:auto}
.opts.ach .opt svg.pea-svg{width:140px;height:auto}
.pea-box .pea{width:220px}
.pea-svg.hop{animation:hop .7s ease both}
@keyframes hop{0%{transform:none}35%{transform:translateY(-8%)}60%{transform:translateY(0)}78%{transform:translateY(-3%)}100%{transform:none}}
.opt .stars{font-size:1.3rem}
@media (max-width: 820px){.opt svg.pea-svg,.opts.ach .opt svg.pea-svg{width:110px}.pea-box .pea{width:180px}}
/* ---------- v3: 動くグリンピースさん・星 ---------- */
.pc{display:block;width:100%;height:auto;overflow:visible}
.pc g,.pc path,.pc ellipse,.pc circle{transform-box:view-box}
.pc-rig,.pc-shadow{transform-origin:150px 210px}
.pc-armRi{transform-origin:246px 96px}
.pc-armLi{transform-origin:56px 100px}
.pc-eyes{transform-origin:150px 64px}
.pc-food{transform-origin:283px 36px}

@keyframes pcBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(.98,1.03)}}

body{background:#CDEBC0;background-image:none}
body.mode-teacher{background:var(--surface-2)}
#app{position:relative;z-index:1}
#forest{position:fixed;inset:0;z-index:0;overflow:hidden;--walk:0;pointer-events:none}

.fl{position:absolute;inset:0;background-repeat:repeat-x;background-size:auto 100%;background-position:0 100%;transition:background-position 1.6s cubic-bezier(.45,.05,.3,1)}
.fl.sky{background:linear-gradient(#F6FCE9 0%,#E2F4D2 40%,#C9E8B9 100%)}
.fl.rays{background:repeating-linear-gradient(115deg,rgba(255,255,230,0) 0 70px,rgba(255,252,210,.45) 70px 130px,rgba(255,255,230,0) 130px 300px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 65%);mask-image:linear-gradient(to bottom,#000 0%,transparent 65%);animation:rays 8s ease-in-out infinite alternate}
@keyframes rays{from{opacity:.35;transform:translateX(-20px)}to{opacity:.8;transform:translateX(20px)}}
.fl.far{background-position:calc(var(--walk) * -140px) 100%}
.fl.mid{background-position:calc(var(--walk) * -380px) 100%}

.fl.near{opacity:.95}
.fl.night{background:rgba(8,18,44,.55);display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fl.night{display:block}}
:root[data-theme="dark"] .fl.night{display:block}
.particles{position:absolute;inset:0}
.leaf{position:absolute;top:-6%;width:16px;height:10px;background:var(--c);border-radius:0 80% 0 80%;animation:fall var(--d) linear var(--dl) infinite;opacity:.9}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(40px,28vh) rotate(120deg)}50%{transform:translate(-30px,55vh) rotate(220deg)}75%{transform:translate(30px,80vh) rotate(320deg)}100%{transform:translate(-10px,110vh) rotate(420deg)}}
.glow{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(#FFFBD0,rgba(255,240,140,.0) 70%);box-shadow:0 0 12px 4px rgba(255,245,160,.55);animation:float var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes float{from{transform:translate(0,0);opacity:.2}to{transform:translate(18px,-26px);opacity:1}}
.bfly{position:absolute;left:-60px;width:34px;height:26px;animation:flyx var(--d) linear var(--dl) infinite}
.bfly b{position:absolute;top:0;width:17px;height:24px;background:#FFB347;border:2px solid #7A4A10;border-radius:60% 60% 40% 40%;animation:flap .25s ease-in-out infinite alternate;transform-origin:right center}

@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}

/* 看板:学級目標 */
.goal-sign{display:flex;flex-direction:column;align-items:center;margin:4px auto 16px;position:relative}

/* ミッション */

#forest[data-scene=plaza] .sun,#forest[data-scene=stars] .sun{opacity:1;transform:scale(1)}

#forest[data-scene=flowers] .deco-flowers,#forest[data-scene=rainbow] .deco-rainbow,#forest[data-scene=spring] .deco-spring,#forest[data-scene=fog] .deco-fog,#forest[data-scene=stars] .deco-stars,#forest[data-scene=spring] .deco-stars{opacity:1}

.deco-fog i:nth-child(1){top:30%}.deco-fog i:nth-child(2){top:52%;animation-duration:22s;animation-delay:-6s}.deco-fog i:nth-child(3){top:68%;animation-duration:19s;animation-delay:-11s}

.scene-sign{align-self:flex-start;display:inline-flex;align-items:center;gap:.4em;background:linear-gradient(#D9A066,#B97A3F);color:#FFF8E6;border:4px solid #5E3A18;padding:.15em 1.4em .15em .6em;font-weight:900;font-size:clamp(1.2rem,2.6vw,1.6rem);clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%);text-shadow:0 2px 0 #5E3A18;letter-spacing:.06em}

body.walking .pc .pc-armS{animation:armSw .38s ease-in-out infinite}
body.walking .pc .pc-armB{animation:armSw .38s ease-in-out infinite reverse}
@keyframes armSw{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
body.walking.back-walk .guide .pc .v-sideR,body.walking.back-walk .pea-box .pc .v-sideR{opacity:0}
body.walking.back-walk .guide .pc .v-sideL,body.walking.back-walk .pea-box .pc .v-sideL{opacity:1}
body.walking .pea-box .pc .pc-legL{animation:legL .38s ease-in-out infinite;transform-origin:122px 138px}
body.walking .pea-box .pc .pc-legR{animation:legR .38s ease-in-out infinite;transform-origin:178px 138px}
@media (prefers-reduced-motion: reduce){.deco-fog i,.deco-stars b,.sun,.scene-sign.in{animation:none!important}}
.opts.feel{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width: 820px){.opts.feel{grid-template-columns:repeat(3,minmax(0,1fr))}}
.foot-wrap.mini{max-width:560px}
/* ================= v6: 場面ごとの色・みずうみ・どうぶつ ================= */
.fl.trunks{background-position:calc(var(--walk) * -380px) 100%}
.fl.mid,.fl.far,.fl.near,.fl.trunks{transition:background-position 1.6s cubic-bezier(.45,.05,.3,1),filter 1.4s ease,opacity 1.4s ease}
#forest[data-scene=plaza] .fl.mid{filter:hue-rotate(-22deg) saturate(1.3) brightness(1.1)}
#forest[data-scene=plaza] .fl.far{filter:hue-rotate(-22deg) saturate(1.2) brightness(1.08)}
#forest[data-scene=plaza] .fl.mid,#forest[data-scene=plaza] .fl.trunks{opacity:.55}
#forest[data-scene=flowers] .fl.mid{filter:hue-rotate(205deg) saturate(.85) brightness(1.25)}
#forest[data-scene=flowers] .fl.far{filter:hue-rotate(215deg) saturate(.6) brightness(1.18)}
#forest[data-scene=fog] .fl.mid{filter:hue-rotate(70deg) saturate(.45) brightness(.92)}
#forest[data-scene=fog] .fl.far{filter:hue-rotate(80deg) saturate(.4) brightness(1.02)}
#forest[data-scene=fog] .fl.near{filter:saturate(.55) brightness(.9)}
#forest[data-scene=rainbow] .fl.mid{filter:hue-rotate(-100deg) saturate(1.35) brightness(1.08)}
#forest[data-scene=rainbow] .fl.far{filter:hue-rotate(-90deg) saturate(1.1) brightness(1.1)}
#forest[data-scene=rainbow] .fl.near{filter:hue-rotate(-60deg) saturate(1.1)}
#forest[data-scene=spring] .fl.mid{filter:hue-rotate(48deg) saturate(1.1) brightness(1.05)}
#forest[data-scene=spring] .fl.far{filter:hue-rotate(55deg) saturate(.9) brightness(1.08)}
#forest[data-scene=stars] .fl.mid{filter:hue-rotate(-72deg) saturate(1.5) brightness(1.15)}
#forest[data-scene=stars] .fl.far{filter:hue-rotate(-65deg) saturate(1.2) brightness(1.12)}
.deco-lake{background-position:calc(var(--walk) * -820px) 100%}
#forest[data-scene=rainbow] .deco-lake{opacity:1}
/* どうぶつ */
.animals{position:absolute;inset:0;pointer-events:none}
.an{position:absolute;opacity:0;transition:opacity 1.2s ease}
.an svg{display:block;width:100%;height:auto}
.an.bird{left:-60px;width:calc(46px * var(--s));opacity:1;animation:flyAcross var(--d) linear var(--dl) infinite}
.an.bird .bob{animation:birdBob 1.4s ease-in-out infinite}
.an.bird .wing{animation:wflap .32s ease-in-out infinite alternate;transform-origin:22px 14px;transform-box:view-box}
@keyframes flyAcross{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 120px))}}
@keyframes birdBob{50%{transform:translateY(-14px)}}
@keyframes wflap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
.an-ground{bottom:3%;left:-80px;width:62px;animation:walkAcross var(--d) linear var(--dl) infinite}
@keyframes walkAcross{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 160px))}}
.an .hopper{animation:hop2 .7s ease-in-out infinite}
@keyframes hop2{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px) rotate(-6deg)}}
.an .runner{animation:run2 .3s ease-in-out infinite}
@keyframes run2{50%{transform:translateY(-6px)}}
#forest[data-scene=entry] .rabbit,#forest[data-scene=plaza] .rabbit,#forest[data-scene=flowers] .rabbit,#forest[data-scene=stars] .rabbit{opacity:1}
#forest[data-scene=entry] .squirrel,#forest[data-scene=plaza] .squirrel,#forest[data-scene=stars] .squirrel,#forest[data-scene=fog] .squirrel{opacity:1}
.an.bee{bottom:17%;width:30px;animation:beeX 7s ease-in-out var(--dl) infinite alternate}
.an.bee .zig{animation:beeY .9s ease-in-out infinite}
.an.bee .bw{animation:flap .08s linear infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes beeX{from{transform:translateX(-80px)}to{transform:translateX(120px)}}
@keyframes beeY{50%{transform:translateY(-22px)}}
#forest[data-scene=flowers] .bee,#forest[data-scene=plaza] .bee{opacity:1}
.an.duck{bottom:6%;width:64px;animation:duck 6s ease-in-out var(--dl) infinite alternate}
@keyframes duck{0%{transform:translateX(0) rotate(-3deg)}50%{transform:translateX(30px) rotate(3deg)}100%{transform:translateX(70px) rotate(-3deg)}}
.an.fish{bottom:4%;width:40px}
#forest[data-scene=rainbow] .fish{animation:fishJ 4.2s ease-in-out infinite}
#forest[data-scene=rainbow] .fish.f2{animation-delay:-2s}
@keyframes fishJ{0%,55%{transform:translate(0,40px) rotate(0);opacity:0}62%{opacity:1}70%{transform:translate(30px,-60px) rotate(-40deg);opacity:1}80%{transform:translate(60px,-10px) rotate(40deg);opacity:1}86%,100%{transform:translate(70px,40px) rotate(60deg);opacity:0}}
#forest[data-scene=rainbow] .duck{opacity:1}
.an.owl{left:3%;top:30%;width:70px}
.an.owl .oe{animation:owlBlink 3.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes owlBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#forest[data-scene=fog] .owl{opacity:1}
.an.dfly{left:-60px;width:50px;animation:flyAcross 11s linear var(--dl) infinite}
.an.dfly .dw{animation:flap .06s linear infinite alternate;transform-box:fill-box;transform-origin:center}
#forest[data-scene=spring] .dfly,#forest[data-scene=rainbow] .dfly{opacity:1}
/* よこ・うしろの 足 */
.pc-sLegA{transform-origin:140px 136px}.pc-sLegB{transform-origin:168px 136px}
body.walking .pc .pc-sLegA{animation:legL .38s ease-in-out infinite}
body.walking .pc .pc-sLegB{animation:legR .38s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.an,.an *{animation:none!important}}
#forest[data-scene=rainbow] .fl.near{opacity:0}
.opts.feel .opt span{font-size:1.1rem;white-space:nowrap}
/* ================= v7: Formsへ おくる ================= */
.send-bg{z-index:60;background:rgba(20,40,20,.55)}
.send-box{background:var(--surface);border-radius:26px;width:min(980px,96vw);height:min(92vh,900px);display:flex;flex-direction:column;overflow:hidden;border:5px solid #6B4220;box-shadow:0 10px 0 #8A5A2B}
.send-head{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#FFF8E1;border-bottom:3px solid #E6CF97}
.send-head p{margin:0;font-size:1.5rem;font-weight:900;line-height:1.35}
.send-head b{color:#E4574B;font-size:1.25em}
.send-pea{width:110px;flex:none}
.send-frame{flex:1;width:100%;border:0;background:#fff}
.send-row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px;border-top:3px solid #E6CF97;background:#FFF8E1}
.send-row .go{font-size:1.5rem;padding:.45em 1.4em}
.unsent{margin-top:4px;font-size:1.05rem;background:#FFF8E1;border-color:#E4574B;color:#8A2A20}
</style>
</head>

function missionFacts(m,list){
  list=list||allRecords();var recs=list.filter(function(r){return r.missionId===m.id;}),kids={},plans={};

function speak(text,cb){
  var fired=false,done=function(){if(!fired){fired=true;if(cb)cb();}};
  if(!canSpeak||!SET.voice||!text){if(cb)setTimeout(done,1400);return;}

function compareOf(list){

  var k=Math.min(5,Math.ceil(n/2)),now=list.slice(n-k),prev=list.slice(Math.max(0,n-2*k),n-k);
  function rate(arr,fn){return arr.length?arr.filter(fn).length/arr.length:0;}
  function avg(arr){return arr.reduce(function(s,r){return s+r.rating;},0)/arr.length;}
  var checks=[
    [avg(now)-avg(prev)>=0.5,"まえより、ミッションが できるように なってきたよ"],
    [rate(now,function(r){return r.star;})-rate(prev,function(r){return r.star;})>=0.2,"まえより、ほしを たくさん あげられたね"],
    [rate(prev,function(r){return feelOf(r.feeling).neg;})-rate(now,function(r){return feelOf(r.feeling).neg;})>=0.2,"まえより、にこにこの ひが ふえたね"],
    [rate(now,function(r){return r.plan||r.next;})>=0.6,"つぎに どうするか、じぶんで きめられて いるね"]
  ];
  for(var i=0;i<checks.length;i++){if(checks[i][0])return {msg:checks[i][1],prev:prev,now:now};}

}

function csvCell(v){v=String(v==null?"":v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(includeSample){
  var list=includeSample?allRecords():sortRecs(REC.slice()),start=baselineStart(list);
  var head=["日付","時刻","出席番号","学級目標","ミッション","場面","できぐあい(1-5)","できぐあい(ことば)","きもち","きもちの向き","うまくいかなかったわけ","つぎはこうする(改善点)","つぎも(プラスのとき)","前回の改善点","前回のできぐあい","成長(1/0)","星","連続","どうして?","言い直し","期間の区分","質問の版","見本"];
  var rows=[head.join(",")];
  list.forEach(function(r){rows.push([r.date,r.time,r.no,r.classGoal||"",r.mission||"",r.subject||"",r.rating,rateOf(r.rating).label,feelOf(r.feeling).label,r.branch==="neg"?"マイナス":"プラス",(r.reasons||[]).map(plain).join("・"),plain(r.plan),plain(r.next),plain(r.prevPlan),r.prevRating||"",r.growth?1:0,r.star||0,r.streak||0,r.why?(byId(WHY,r.why)||{label:r.why}).label:"",r.corrected?"あり":"",periodOf(r.date,start),r.ver||"",r.sample?"見本":""].map(csvCell).join(","));});
  return "\uFEFF"+rows.join("\r\n")+"\r\n";
}
function exportCSV(includeSample){
  if(!includeSample&&!REC.length){toast("この端末の記録はまだありません");return;}
  var data=buildCSV(includeSample),name="ふりかえり_"+todayStr()+(includeSample?"_見本込み":"")+".csv";
  dlPromise.then(function(dl){
    if(dl){dl.save({filename:name,data:data}).then(function(){toast("保存しました");}).catch(function(e){var c=e&&e.code;toast(c==="declined"?"保存を取り消しました":c==="rate_limited"?"少し待ってから、もう一度押してください":"この画面ではファイルを保存できません");});}
    else if(!window.claude){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);toast("保存しました");}

function importRows(rows){
  if(!rows.length)return {n:0,msg:"行がありません"};
  var head=rows[0].map(function(x){return String(x||"").trim();}),col=function(name){for(var i=0;i<head.length;i++){if(head[i]===name)return i;}for(i=0;i<head.length;i++){if(head[i].indexOf(name)>=0)return i;}return -1;};
  var cD=col("データ"),cNo=col("出席番号"),cDate=col("日付");
  if(cD<0||cNo<0||cDate<0)return {n:0,msg:"「出席番号」「日付」「データ」の列が見つかりません。Formsの回答のExcelを選んでください"};
  var got={},out=[];
  for(var i=1;i<rows.length;i++){
    var row=rows[i];if(!row||!row[cD])continue;var d;try{d=JSON.parse(String(row[cD]));}catch(e){continue;}

}

    case "start":auWake();bgmStart();S.mode="kid";S.ans=newAns();S.flow=baseFlow().concat(["star"]);S.feed=null;S.letter=null;S.ctx={prev:null};S.i=-1;goStep(0,"こんにちは!ぼく "+PEA+"。もりの なかで いっしょに ふりかえろう!");break;
    case "teacher":S.pinOpen=true;S.pinBuf="";S.pinErr="";render();break;
    case "pin":if(S.pinBuf.length<4)S.pinBuf+=v;if(S.pinBuf.length===4){if(S.pinBuf===String(SET.pin)){S.tpin=S.pinBuf;S.pinOpen=false;S.mode="teacher";speechCancel();}else{S.pinErr="番号がちがいます";S.pinBuf="";}}render();break;
    case "pinclr":S.pinBuf=S.pinBuf.slice(0,-1);S.pinErr="";render();break;
    case "pinclose":S.pinOpen=false;render();break;
    case "listen":speak(listenText());break;
    case "back":speechCancel();if(S.i>0)goStep(S.i-1);break;
    case "no":
      var nn=Number(v);
      if(doneToday(nn)){S.bubble=nn+"ばんさんは、きょうは もう ふりかえったよ!また あした ね。";render();break;}
      a.no=nn;var rs=recsOf(nn),prev=rs[rs.length-1]||null;S.ctx={prev:prev};
      goStep(1,nn+"ばんさん、こんにちは!");break;
    case "rate":a.rating=Number(v);S.bubble=RATE_R[v];render();afterPick(function(){goStep(S.flow.indexOf("rate")+1);});break;
    case "feel":
      a.feeling=v;S.bubble=FEEL_R[v];render();
      afterPick(function(){
        var keepWhy=a.why;S.flow=buildFlow();if(S.flow.indexOf("why")<0&&keepWhy!=="honto")a.why="";
        if(!feelOf(a.feeling).neg){a.reasons=[];a.plan="";}
        var nx=S.flow[S.flow.indexOf("feel")+1];
        if(nx==="star")finishKid();
        else if(nx==="why"){var j=judge(S.ctx.prev,a.rating);goStep(S.flow.indexOf("why"),j.streak+"かい つづけて ほしを あげて いるね!"+PEA+"から しつもん だよ");}
        else goStep(S.flow.indexOf(nx));
      });
      break;
    case "reason":opts=parseOpts(m.reasons);o=opts[Number(v)];if(!o)break;a.reasons=[o.disp];S.bubble="そうだったんだね。おしえてくれて ありがとう";render();afterPick(function(){goStep(S.flow.indexOf("plan"));});break;
    case "plan":opts=parseOpts(m.plans);o=opts[Number(v)];if(!o)break;a.plan=o.disp;S.bubble="「"+o.disp+"」、いいね!つぎ ためして みよう";render();afterPick(finishKid);break;
    case "why":
      if(v==="honto"){
        a.why="honto";a.corrected=true;a.rating=0;S.flow=baseFlow().concat(["star"]);
        goStep(S.flow.indexOf("rate"),"おしえてくれて ありがとう。ほんとうの ことを いえるのは かっこいいよ。もういちど えらんでね");
      } else {
        a.why=v;var pv=S.ctx.prev?(S.ctx.prev.plan||S.ctx.prev.next):"";
        S.bubble={tamesita:pv?"「"+pv+"」を ためしたんだね!すごい":"ためして みたんだね!すごい",kiwotsuketa:"じぶんで きを つけたんだね!",tomodachi:"ともだちの おかげも あったんだね。ありがとうって いえると いいね",sensei:"せんせいの こえを きいて できたんだね",nantonaku:"なんとなく できたんだね。つぎは なにが よかったか かんがえて みよう"}[v];
        render();afterPick(finishKid);
      }
      break;
    case "feed":if(S.feed&&S.feed.phase==="ready")startEating();break;
    case "done":speechCancel();S.pickTok++;S.mode="home";S.ans=null;render();refreshFromSheet();window.scrollTo(0,0);walk(1);speak("またね!あした また あおうね!");break;
    case "unlock":var un=Number(v);if(window.confirm(un+"番の今日の記録を消して、もう一度答えられるようにします。よろしいですか?")){var td=todayStr();REC=REC.filter(function(r){return !(r.no===un&&r.date===td);});saveRecords();render();
      if(GAS)gasCall("deleteToday",S.tpin,un,td).then(function(r){toast(r&&r.ok?un+"番が今日もう一度答えられるようになりました":"消せませんでした");}).catch(function(){toast("消せませんでした");});else toast(un+"番が今日もう一度答えられるようになりました");}break;
    case "lock":S.mode="home";render();window.scrollTo(0,0);refreshFromSheet();break;
    case "opensheet":if(SHEET_URL)window.open(SHEET_URL,"_blank");break;
    case "tab":S.tab=v;render();break;
    case "person":S.person=Number(v);S.tab="person";render();window.scrollTo(0,0);break;
    case "pprev":S.person=Math.max(1,S.person-1);render();break;
    case "pnext":S.person=Math.min(Number(SET.classSize)||30,S.person+1);render();break;
    case "pickdate":S.dateSel=v;render();break;
    case "savegoal":SET.classGoal=document.getElementById("cgoal").value.trim()||DEFAULTS.classGoal;saveSettings();render();toast("学級目標を保存しました");break;
    case "savemission":
      var f=readForm("e");if(!f.text){toast("ミッションを入れてください");break;}if(!(f.target>=5&&f.target<=100)){toast("星の数は5〜100にしてください");break;}
      if(!parseOpts(f.reasons).length||!parseOpts(f.plans).length){toast("選択肢を1つ以上入れてください");break;}
      m.month=f.month;m.text=f.text;m.target=f.target;m.reasons=f.reasons;m.plans=f.plans;sampleCache=null;saveSettings();render();toast("ミッションを保存しました");break;
    case "newmission":
      var nf=readForm("n");if(!nf.text){toast("ミッションを入れてください");break;}if(!(nf.target>=5&&nf.target<=100)){toast("星の数は5〜100にしてください");break;}
      if(!parseOpts(nf.reasons).length||!parseOpts(nf.plans).length){toast("選択肢を1つ以上入れてください");break;}
      nf.id="m"+Date.now();nf.message="";SET.missions.push(nf);SET.currentMission=nf.id;sampleCache=null;saveSettings();S.tab="message";render();toast("新しいミッションを始めました。メッセージを用意しましょう");break;
    case "usemission":SET.currentMission=v;sampleCache=null;saveSettings();render();toast("ミッションを切りかえました");break;
    case "savemsg":m.message=document.getElementById("msgtext").value.trim();saveSettings();render();toast("メッセージを保存しました");break;
    case "genmsg":
      S.busy="gen";render();
      genMessage(m).then(function(t){S.busy="";m.message=t;saveSettings();render();toast("Claudeが書きました。直したいところがあれば直して保存してください");})
        .catch(function(err){S.busy="";render();toast(sampleErrText(err));});
      break;
    case "savepersona":
      ["self","call","tone","phrase","like","value"].forEach(function(k){SET.persona[k]=document.getElementById("p_"+k).value.trim();});saveSettings();render();toast("先生のようすを保存しました");break;
    case "savepin":var p=(document.getElementById("npin").value||"").trim();if(!/^\d{4}$/.test(p)){toast("4けたの数字を入れてください");break;}SET.pin=p;saveSettings();render();toast("暗証番号を変更しました");break;
    case "csv":exportCSV(v==="all");break;
    case "voicetest":auWake();speak("こんにちは!ぼく、グリンピースさん。もりの なかで いっしょに ふりかえろう!");break;
    case "wipe":if(!REC.length){toast("消す記録はありません");break;}if(window.confirm("この端末の記録 "+REC.length+"件 をすべて消します。元にもどせません。よろしいですか?")){REC=[];saveRecords();render();toast("記録を消しました");}break;
  }
  if(S.mode==="kid"&&pMode==="kid"&&S.i===pI&&S.bubble!==pBub&&["listen","feed","rate","feel","reason","plan","why"].indexOf(act)<0)speak(S.bubble);

});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="xlsin"&&el.files&&el.files[0]){
    var file=el.files[0];S.impMsg="読みこみ中…";render();
    loadXLSX().then(function(X){return file.arrayBuffer().then(function(buf){var wb=X.read(buf,{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});});})
      .then(function(rows){var r=importRows(rows);S.impMsg=r.msg||(r.n+"件を読みこみました");render();toast(S.impMsg);})
      .catch(function(){S.impMsg="読みこめませんでした(インターネットにつながっているか確認してください)";render();});
    return;
  }
  var k=el.getAttribute&&el.getAttribute("data-set");if(!k)return;
  if(k==="dateSel"){S.dateSel=el.value;render();return;}
  if(k==="person"){S.person=Number(el.value);render();return;}
  if(k==="showSample"||k==="starForTop"||k==="omakase"||k==="sound"||k==="voice")SET[k]=el.checked;
  else if(k==="bgmVol"){SET.bgmVol=Number(el.value);if(AU.bgm&&AU.on)AU.bgm.gain.setTargetAtTime(bgmLevel(),AU.ctx.currentTime,0.1);}
  else if(k==="classSize"){var n=Math.round(Number(el.value));if(!(n>=1&&n<=45)){toast("1〜45の数を入れてください");render();return;}SET.classSize=n;}
  else if(k==="baselineDays"||k==="alertRun"||k==="whyEvery")SET[k]=Number(el.value);
  else SET[k]=el.value;
  sampleCache=null;saveSettings();render();toast("設定を保存しました");
});
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){};}catch(e){}}
document.body.insertAdjacentHTML("afterbegin",forestHTML());
document.addEventListener("pointerdown",function first(){auWake();if(S.mode!=="teacher")bgmStart();document.removeEventListener("pointerdown",first,true);},true);
if(GAS){
  app.innerHTML='<main class="home"><div class="home-card" style="text-align:center"><div style="width:220px;margin:0 auto">'+peaChar({expr:"happy"})+'</div><p class="big-msg" style="background:rgba(255,253,243,.95);border-radius:18px;padding:.3em .8em;display:inline-block">よみこみちゅう…</p></div></main>';
  gasCall("getBoot").then(function(b){applyBoot(b);BOOTED=true;render();}).catch(function(e){app.innerHTML='<main class="home"><div class="home-card"><p class="big-msg" style="background:#fff;border-radius:18px;padding:.5em 1em">よみこめませんでした。せんせいに しらせてね。</p><p class="muted" style="background:#fff;padding:.5em 1em;border-radius:12px">'+esc(e&&e.message||e)+'</p></div></main>';});
} else render();
})();
